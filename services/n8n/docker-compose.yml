services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: content-machine-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - ../../.env
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Europe/Moscow
      - TZ=Europe/Moscow
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/files/data
      - NODE_FUNCTION_ALLOW_BUILTIN=fs,path,child_process
      - NODE_FUNCTION_ALLOW_EXTERNAL=pngjs,ffprobe-static
      - HIGGSFIELD_VIDEO_MODEL=${HIGGSFIELD_VIDEO_MODEL}
      - HIGGSFIELD_DOP_ENDPOINT=${HIGGSFIELD_DOP_ENDPOINT}
      - PUBLIC_FILES_BASE_URL=${PUBLIC_FILES_BASE_URL}
      - PUBLIC_FRAME_PUBLISH_MODE=${PUBLIC_FRAME_PUBLISH_MODE}
      - PUBLIC_FRAME_REPO=${PUBLIC_FRAME_REPO}
      - PUBLIC_FRAME_BRANCH=${PUBLIC_FRAME_BRANCH}
      - PUBLIC_FRAME_PUBLIC_BASE_URL=${PUBLIC_FRAME_PUBLIC_BASE_URL}
    volumes:
      - n8n_data:/home/node/.n8n
      - ../../data:/files/data

volumes:
  n8n_data:
